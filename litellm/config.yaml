# Models are stored in the database (STORE_MODEL_IN_DB=True) and managed through
# the admin UI (/ui) or the /model/new API, so there is no model_list here.
# Ollama is reachable from LiteLLM at http://ollama:11434.

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
